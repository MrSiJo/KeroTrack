# Dependabot v2 config — keeps things up to date without proposing
# scary major-version jumps without human review.
#
# Defaults applied to every ecosystem below:
#   - Ignore semver-major updates (request manually when ready).
#   - Group all updates per ecosystem into a single PR per cycle so
#     we don't get drowned in dozens of one-line bumps.
#
# To take a major bump (e.g. vite 5 → 6), open a Dependabot PR by hand
# from the GitHub UI ("Update dependencies") or run the relevant
# `npm update --save` / `uv lock` etc. locally.

version: 2
updates:
  # SvelteKit frontend.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-deps:
        patterns:
          - "*"

  # FastAPI backend.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backend-deps:
        patterns:
          - "*"

  # Backend Dockerfile base image (python:3.12-slim).
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Frontend Dockerfile base images (node:20-alpine, nginx:alpine).
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      gha-deps:
        patterns:
          - "*"
