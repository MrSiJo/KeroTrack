server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. `always` so they're emitted on error responses too.
    # CSP is tuned for the SvelteKit adapter-static build: scripts are
    # external fingerprinted files under /_app/ (script-src 'self'), but
    # hydration emits inline <style> tags so style-src needs 'unsafe-inline'.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SPA routing — serve index.html for unknown paths so SvelteKit handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted static assets. nginx resets inherited
    # add_header directives once a location sets its own, so the security
    # headers are re-emitted here to cover the JS/CSS bundle responses.
    location /_app/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SSE / API requests need a longer timeout than the nginx default.
    location /api/ {
        proxy_pass http://backend:9176/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SET (not append) so a client-supplied X-Forwarded-For can't rotate
        # the slowapi rate-limit key. $remote_addr is the immediate peer
        # (nginx-proxy-manager), the only IP we trust to populate this header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
