server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — serve index.html for unknown paths so SvelteKit handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted static assets.
    location /_app/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SSE / API requests need a longer timeout than the nginx default.
    location /api/ {
        proxy_pass http://backend:9176/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
