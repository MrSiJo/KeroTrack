services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kerotrack-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-9176}:9176"
    volumes:
      - kerotrack-data:/app/data
      - kerotrack-logs:/app/logs
    networks:
      - kerotrack-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:9176}
    container_name: kerotrack-ui
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-9177}:80"
    depends_on:
      - backend
    networks:
      - kerotrack-net

volumes:
  kerotrack-data:
  kerotrack-logs:

networks:
  kerotrack-net:
    driver: bridge
