# Pre-commit security hooks. Install once with `pre-commit install`.
#
# Goals (security-only — formatters/typecheckers live elsewhere):
#   - block secrets ever entering git
#   - flag obvious code-level security issues in Python (bandit, ruff S-rules)
#   - keep the security-invariant tests green
#
# Run on demand: `pre-commit run --all-files`

repos:
  # ------------------------------------------------------------ secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ------------------------------------------------------------ python sec
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        # B101 = `assert` (we use it for sanity checks, not security).
        args: ["-r", "backend/kerotrack", "--skip", "B101"]
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        # `S` = flake8-bandit ruleset. Limit to backend lib code; frontend
        # has its own ecosystem and tests legitimately use insecure idioms.
        args: ["check", "--select=S"]
        files: ^backend/kerotrack/.*\.py$

  # ----------------------------------------------- forbid environment IPs
  # Block accidentally committing real LAN IPv4 literals (RFC 1918 ranges)
  # into source. Settings that vary per deployment belong in the DB
  # `settings` table or `.env`, not in code. Tests that need an example
  # address should use RFC 5737 documentation ranges (192.0.2.x,
  # 198.51.100.x, 203.0.113.x) — those are explicitly allowed.
  - repo: local
    hooks:
      - id: forbid-environment-ips
        name: no hardcoded environment IPs
        language: pygrep
        entry: '\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})\b'
        # Historical docs are exempt (already sanitised in the working tree
        # but old commits remain). The pre-commit config itself references
        # the allowed/disallowed ranges in comments.
        exclude: ^(docs/|\.pre-commit-config\.yaml$)

  # --------------------------------------------------------- invariants
  # Run the security-invariant tests. Fast (~7s), and they fail loudly if
  # someone removes an auth gate, weakens the password policy, or breaks the
  # one-shot setup guard.
  - repo: local
    hooks:
      - id: security-invariants
        name: backend security invariants
        # Manual-only — pytest needs the project's runtime deps which are
        # awkward to declare in pre-commit's isolated env. Run on demand
        # against the active venv:
        #     pre-commit run --hook-stage manual security-invariants
        # Or just call pytest directly:
        #     python -m pytest backend/tests/api/test_security_invariants.py
        # CI / release-prep should always run the test directly.
        language: system
        entry: python -m pytest backend/tests/api/test_security_invariants.py -q
        pass_filenames: false
        stages: [manual]
