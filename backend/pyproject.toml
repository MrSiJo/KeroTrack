[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kerotrack"
version = "0.0.0"
description = "KeroTrack v2 — FastAPI backend for tank telemetry, analysis and notifier"
requires-python = ">=3.12"
license = { text = "CC-BY-NC-4.0" }
authors = [{ name = "MrSiJo" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiosqlite>=0.20",
    "sqlalchemy>=2.0.36",
    "aiomqtt>=2.3",
    "apscheduler>=3.10",
    "apprise>=1.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "cron-converter>=1.2",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "cryptography>=43.0",
    "beautifulsoup4>=4.12",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "freezegun>=1.5",
]

[project.scripts]
kerotrack = "kerotrack.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kerotrack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:passlib",
]
