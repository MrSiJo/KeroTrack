# Tests on every push to a branch other than main, on the Forgejo runner
# (pelops CT155). main runs them through deploy.yml instead.
# Jobs get no Docker socket and no host folders. GitHub ignores .forgejo/
# (it runs .github/workflows on its own copy for the ghcr images).
# Template: simon/ci-deploy templates/ci.yml.
name: ci

on:
  push:
    branches-ignore: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_call:

jobs:
  backend:
    runs-on: docker
    container:
      image: python:3.12-bookworm
    steps:
      - name: Check out
        run: |
          git clone -q --no-checkout "${{ vars.CI_FORGEJO_URL }}/${{ github.repository }}.git" src
          git -C src checkout -q "${{ github.sha }}"
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: http.extraHeader
          GIT_CONFIG_VALUE_0: "Authorization: token ${{ github.token }}"
      - name: Install
        working-directory: src
        run: pip install -q --constraint backend/constraints.txt "./backend[dev]" ruff
      - name: Ruff (security rules, as the pre-commit hook)
        working-directory: src
        run: ruff check --select=S backend/kerotrack
      - name: Pytest
        working-directory: src/backend
        run: python -m pytest -q

  frontend:
    runs-on: docker
    container:
      image: node:20-bookworm   # the frontend Dockerfile builds on node 20
    steps:
      - name: Check out
        run: |
          git clone -q --no-checkout "${{ vars.CI_FORGEJO_URL }}/${{ github.repository }}.git" src
          git -C src checkout -q "${{ github.sha }}"
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: http.extraHeader
          GIT_CONFIG_VALUE_0: "Authorization: token ${{ github.token }}"
      - name: Check, test and build
        working-directory: src/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run test
          npm run build
